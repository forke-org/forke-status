<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forke Status</title>
<meta name="description" content="Live status of forke.space, the Forke dashboard, the Forke API and Forke Mail.">
<link rel="icon" href="forke-mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #151414; --surface: #1C1B1A; --surface-2: #22201F; --line: #f0e3de20; --line-strong: #f0e3de38;
    --ink: #F4F4F5; --ink-2: #d4d0cd; --muted: #8E8E93; --faint: #5f5c5a;
    --accent: #FF7A00; --accent-ink: #FFA347; --accent-soft: rgba(255,122,0,.1);
    --ok: #4ade80; --ok-soft: rgba(74,222,128,.1); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.1); --bad: #f87171; --bad-soft: rgba(248,113,113,.1);
    --none: #2a2827;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.5 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { position: relative; max-width: 960px; min-height: 100vh; margin: 0 auto; padding: 0 36px;
    background-image: linear-gradient(var(--line) 50%, transparent 50%), linear-gradient(var(--line) 50%, transparent 50%);
    background-size: 1px 32px, 1px 32px; background-repeat: repeat-y; background-position: 0 0, 100% 0; }
  .rule { position: relative; height: 1px; margin: 0 -36px; background: var(--line); }
  .rule::before, .rule::after { content: ""; position: absolute; top: -3px; width: 7px; height: 7px; background: var(--bg); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .rule::before { left: -3px; } .rule::after { right: -4px; }
  @media (max-width: 640px) { .wrap { padding: 0 16px; } .rule { margin: 0 -16px; } }
  code, .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 22px 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  .brand b { font-size: 20px; letter-spacing: -.04em; font-weight: 600; }
  .brand b span { color: var(--accent); }
  .brand em { font-style: normal; font-size: 12px; font-weight: 500; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
  .updated { color: var(--muted); font-size: 13px; }
  .banner { margin: 20px 0 18px; padding: 18px 20px; border-radius: 8px; display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 17px; }
  .banner .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px color-mix(in srgb, currentColor 18%, transparent); flex: none; }
  .banner.operational { background: var(--ok-soft); color: var(--ok); }
  .banner.degraded { background: var(--warn-soft); color: var(--warn); }
  .banner.down { background: var(--bad-soft); color: var(--bad); }
  .banner.loading { background: var(--surface); color: var(--muted); }
  nav.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 8px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); overflow-x: auto; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs a { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; font-size: 14px; font-weight: 500; line-height: 1; color: var(--muted); text-decoration: none; white-space: nowrap; }
  nav.tabs a:hover { color: var(--ink); }
  nav.tabs a[aria-current="page"] { background: var(--surface-2); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong); }
  nav.tabs .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .pip.operational { background: var(--ok); } .pip.degraded { background: var(--warn); } .pip.down { background: var(--bad); }
  main { padding: 18px 0 40px; }
  .card { background: var(--surface); border-radius: 8px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 16px; overflow: hidden; }
  .card-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .card-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .card-head p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .card-body { padding: 16px 18px; }
  .svc { padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .svc:last-child { border-bottom: 0; }
  .svc-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .svc-top a { font-weight: 600; text-decoration: none; }
  .svc-top a:hover { color: var(--accent-ink); }
  .svc-top small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.operational { background: var(--ok-soft); color: var(--ok); } .badge.degraded { background: var(--warn-soft); color: var(--warn); } .badge.down { background: var(--bad-soft); color: var(--bad); } .badge.unknown { background: var(--surface-2); color: var(--muted); }
  .bars { display: flex; gap: 2px; height: 32px; align-items: stretch; }
  .bars i { flex: 1; border-radius: 2px; background: var(--none); min-width: 2px; }
  .bars i.full { background: var(--ok); } .bars i.minor { background: color-mix(in srgb, var(--ok) 55%, var(--warn)); } .bars i.partial { background: var(--warn); } .bars i.major { background: var(--bad); }
  .bars-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--surface-2); border-radius: 8px; padding: 14px; box-shadow: inset 0 0 0 1px var(--line); }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 500; line-height: 1; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong); }
  svg.chart { width: 100%; height: 120px; display: block; }
  .incidents { list-style: none; margin: 0; padding: 0; }
  .incidents li { padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .incidents li:last-child { border-bottom: 0; }
  .incidents small { color: var(--muted); }
  .empty { padding: 22px 18px; color: var(--muted); font-size: 14px; text-align: center; }
  .note { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }
  .note b { color: var(--ink-2); font-weight: 600; }
  footer { padding: 18px 0 40px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer a { color: var(--accent-ink); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="https://www.forke.space"><img src="forke-mark.png" alt=""><b>forke<span>*</span></b><em>status</em></a>
    <span class="updated" id="updated">Loading…</span>
  </header>
  <div class="rule"></div>
  <div class="banner loading" id="banner"><span class="dot"></span><span id="banner-text">Checking every service…</span></div>
  <nav class="tabs" id="tabs" aria-label="Services"></nav>
  <main id="view"></main>
  <div class="rule"></div>
  <footer>
    <span>Checked about every 5 minutes from outside our servers.</span>
    <span><a href="https://www.forke.space">forke.space</a> · <a href="https://mail.forke.space">Forke Mail</a></span>
  </footer>
</div>
<script>
(() => {
  const params = new URLSearchParams(location.search)
  const DATA_URL = params.get('data') || 'https://raw.githubusercontent.com/forke-org/forke-status/data/status.json'
  const LIVE_MAIL = 'https://mail.forke.space/api/public/status'
  const ORDER = ['website', 'dashboard', 'api', 'mail']
  const LABEL = { operational: 'Operational', degraded: 'Degraded', down: 'Outage', unknown: 'No data' }
  let data = null
  let liveMail = null
  let mailWindow = '7d'

  const $ = (id) => document.getElementById(id)
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
  const pct = (v, digits = 2) => v == null ? '—' : `${(v * 100).toFixed(digits).replace(/\.?0+$/, '')}%`
  const secs = (v) => v == null ? '—' : v < 60 ? `${v.toFixed(1)}s` : `${(v / 60).toFixed(1)}m`
  const ago = (iso) => {
    if (!iso) return 'never'
    const s = Math.round((Date.now() - new Date(iso)) / 1000)
    if (s < 60) return 'just now'
    if (s < 3600) return `${Math.floor(s / 60)} min ago`
    if (s < 86400) return `${Math.floor(s / 3600)} h ago`
    return new Date(iso).toLocaleString()
  }
  const when = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
  const services = () => ORDER.map((id) => data?.services?.[id]).filter(Boolean)

  function uptime(svc, days) {
    const keys = Object.keys(svc.days || {}).sort().slice(-days)
    let up = 0, checks = 0
    for (const k of keys) { up += svc.days[k].up; checks += svc.days[k].checks }
    return checks ? up / checks : null
  }

  function bars(svc) {
    const out = []
    const today = new Date()
    for (let i = 89; i >= 0; i--) {
      const d = new Date(today); d.setUTCDate(d.getUTCDate() - i)
      const key = d.toISOString().slice(0, 10)
      const day = svc.days?.[key]
      let cls = '', title = `${key}: no data`
      if (day && day.checks) {
        const u = day.up / day.checks
        cls = u >= 0.999 ? 'full' : u >= 0.99 ? 'minor' : u >= 0.95 ? 'partial' : 'major'
        title = `${key}: ${pct(u)} up`
      }
      out.push(`<i class="${cls}" title="${title}"></i>`)
    }
    return `<div class="bars">${out.join('')}</div><div class="bars-foot"><span>90 days ago</span><span>${pct(uptime(svc, 90))} uptime</span><span>Today</span></div>`
  }

  function chart(svc) {
    const pts = (svc.samples || []).filter((s) => s.ok)
    if (pts.length < 2) return '<p class="empty">Not enough checks yet.</p>'
    const max = Math.max(...pts.map((p) => p.ms), 500)
    const w = 600, h = 110
    const line = pts.map((p, i) => `${(i / (pts.length - 1) * w).toFixed(1)},${(h - p.ms / max * (h - 10) - 4).toFixed(1)}`).join(' ')
    const avg = Math.round(pts.reduce((a, p) => a + p.ms, 0) / pts.length)
    return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Response time, last 24 hours"><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
      <div class="bars-foot"><span>24 hours ago</span><span>average ${avg} ms · slowest ${max} ms</span><span>Now</span></div>`
  }

  function incidents(list) {
    if (!list.length) return '<p class="empty">No incidents recorded.</p>'
    return `<ul class="incidents">${list.slice(0, 15).map((i) => {
      const name = data.services[i.service]?.name || i.service
      const dur = i.resolvedAt ? `${Math.max(1, Math.round((new Date(i.resolvedAt) - new Date(i.startedAt)) / 60000))} min` : 'ongoing'
      return `<li><span><b>${esc(name)}</b> · ${esc(i.reason)}</span><small>${when(i.startedAt)} · ${dur}</small></li>`
    }).join('')}</ul>`
  }

  function renderTabs(active) {
    const list = [['overview', 'Overview', overall()], ...services().map((s) => [s.id, s.name, s.status])]
    $('tabs').innerHTML = list.map(([id, label, st]) =>
      `<a href="#${id}" ${id === active ? 'aria-current="page"' : ''}><span class="pip ${st || ''}"></span>${esc(label)}</a>`).join('')
    $('tabs').querySelector('[aria-current]')?.scrollIntoView({ inline: 'center', block: 'nearest' })
  }

  function overall() {
    const sts = services().map((s) => s.status)
    if (!sts.length) return 'unknown'
    if (sts.includes('down')) return 'down'
    if (sts.includes('degraded')) return 'degraded'
    return 'operational'
  }

  function renderBanner() {
    const st = overall()
    const down = services().filter((s) => s.status !== 'operational').map((s) => s.name)
    $('banner').className = `banner ${st === 'unknown' ? 'loading' : st}`
    $('banner-text').textContent = st === 'operational' ? 'All systems operational'
      : st === 'unknown' ? 'Status data is not available yet'
      : `${st === 'down' ? 'Outage' : 'Degraded performance'}: ${down.join(', ')}`
    $('updated').textContent = data?.updatedAt ? `Updated ${ago(data.updatedAt)}` : ''
  }

  function overview() {
    return `<section class="card"><div class="card-head"><div><h2>All services</h2><p>Uptime over the last 90 days</p></div></div>
      ${services().map((s) => `<div class="svc"><div class="svc-top"><a href="#${s.id}">${esc(s.name)}<small>${esc(s.description)}</small></a><span class="badge ${s.status}">${LABEL[s.status]}</span></div>${bars(s)}</div>`).join('')}
    </section>
    <section class="card"><div class="card-head"><div><h2>Recent incidents</h2><p>Times a service failed two checks in a row</p></div></div>${incidents(data.incidents || [])}</section>`
  }

  function serviceView(svc) {
    const last = svc.lastCheck || {}
    return `<section class="card"><div class="card-head"><div><h2>${esc(svc.name)}</h2><p>${esc(svc.description)}</p></div><span class="badge ${svc.status}">${LABEL[svc.status]}</span></div>
      <div class="card-body"><div class="grid">
        <div class="stat"><span>Uptime, 24 hours</span><b>${pct(uptime(svc, 1))}</b></div>
        <div class="stat"><span>Uptime, 7 days</span><b>${pct(uptime(svc, 7))}</b></div>
        <div class="stat"><span>Uptime, 90 days</span><b>${pct(uptime(svc, 90))}</b></div>
        <div class="stat"><span>Last check</span><b>${last.ok ? `${last.ms} ms` : 'Failed'}</b><small>${ago(last.t)}</small></div>
      </div></div></section>
      ${svc.id === 'mail' ? mailMetrics(svc) : ''}
      <section class="card"><div class="card-head"><div><h2>Response time</h2><p>Last 24 hours</p></div></div><div class="card-body">${chart(svc)}</div></section>
      <section class="card"><div class="card-head"><div><h2>Uptime</h2><p>Last 90 days</p></div></div><div class="card-body">${bars(svc)}</div></section>
      <section class="card"><div class="card-head"><div><h2>Incidents</h2></div></div>${incidents((data.incidents || []).filter((i) => i.service === svc.id))}</section>`
  }

  function mailMetrics(svc) {
    const m = liveMail || svc.metrics
    if (!m) return ''
    const w = m.windows?.[mailWindow] || {}
    const lim = m.limits || {}
    const btn = (k, label) => `<button type="button" data-window="${k}" aria-pressed="${k === mailWindow}">${label}</button>`
    return `<section class="card"><div class="card-head"><div><h2>Email delivery</h2><p>Every email sent through Forke Mail, across all accounts. Sent through ${esc(m.infrastructure || 'Amazon SES')}.</p></div>
      <div class="seg" id="mail-window">${btn('24h', '24 hours')}${btn('7d', '7 days')}${btn('30d', '30 days')}</div></div>
      <div class="card-body"><div class="grid">
        <div class="stat"><span>Delivered</span><b>${pct(w.delivery_rate)}</b><small>${(w.delivered ?? 0).toLocaleString()} of ${(w.sent ?? 0).toLocaleString()} sent</small></div>
        <div class="stat"><span>Typical delivery time</span><b>${secs(w.delivery_seconds_p50)}</b><small>95% within ${secs(w.delivery_seconds_p95)}</small></div>
        <div class="stat"><span>Bounce rate</span><b>${pct(w.bounce_rate)}</b><small>Sending pauses above ${pct(lim.max_bounce_rate, 1)}</small></div>
        <div class="stat"><span>Spam complaints</span><b>${pct(w.complaint_rate, 3)}</b><small>Sending pauses above ${pct(lim.max_complaint_rate, 1)}</small></div>
      </div>
      <p class="note" style="margin-top:14px">Queue right now: <b>${(m.queue?.transactional_queued ?? 0).toLocaleString()}</b> transactional and <b>${(m.queue?.broadcast_pending ?? 0).toLocaleString()}</b> broadcast emails waiting. Delivery time is from handing the email to Amazon SES until the recipient's server accepts it.</p>
      </div></section>`
  }

  function render() {
    const id = (location.hash || '#overview').slice(1)
    const svc = data?.services?.[id]
    const active = svc ? id : 'overview'
    renderBanner()
    renderTabs(active)
    if (!data) { $('view').innerHTML = '<section class="card"><p class="empty">Loading status…</p></section>'; return }
    $('view').innerHTML = svc ? serviceView(svc) : overview()
    document.querySelectorAll('#mail-window button').forEach((b) => b.addEventListener('click', () => { mailWindow = b.dataset.window; render() }))
  }

  async function load() {
    try {
      const res = await fetch(`${DATA_URL}${DATA_URL.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache: 'no-store' })
      if (res.ok) data = await res.json()
    } catch {}
    try {
      const res = await fetch(LIVE_MAIL, { cache: 'no-store' })
      if (res.ok) liveMail = await res.json()
    } catch {}
    render()
  }

  if (!location.hash && params.get('tab')) history.replaceState(null, '', `${location.pathname}#${encodeURIComponent(params.get('tab'))}`)
  window.addEventListener('hashchange', render)
  render()
  load()
  setInterval(load, 60000)
})()
</script>
</body>
</html>
