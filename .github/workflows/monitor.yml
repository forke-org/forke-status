name: Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['monitor/**', '.github/workflows/monitor.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load previous results
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:status.json > data/status.json || true
          fi
      - name: Check services
        id: check
        run: node monitor/check.mjs data/status.json
      - name: Save results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=$(mktemp -d)
          cp data/status.json "$out/status.json"
          cd "$out"
          git init -q -b data
          git config user.name "forke-status"
          git config user.email "status@forke.space"
          git add status.json
          git commit -q -m "status $(date -u +%Y-%m-%dT%H:%MZ)"
          # GitHub sometimes answers pushes with a 500 for a minute or so. Retry for about
          # two minutes; if it is still down, skip this save instead of failing the run.
          # The next run, five minutes later, checks everything again and saves.
          for wait in 10 20 30 60 0; do
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data && exit 0
            [ "$wait" -gt 0 ] && { echo "push failed, retrying in ${wait}s"; sleep "$wait"; }
          done
          echo "::warning::GitHub rejected the push of status.json; this run's results were not saved"
      - name: Republish page when status changes
        if: steps.check.outputs.changed == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
